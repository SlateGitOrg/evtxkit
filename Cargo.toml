[package]
name = "evtxkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "From-scratch Windows EVTX parser: BinXML templates, CRC32 checks, chunk-parallel JSONL and a Sigma-style field-mapping layer"
readme = "README.md"
keywords = ["evtx", "forensics", "windows", "sigma", "dfir"]
categories = ["parser-implementations", "command-line-utilities"]
exclude = ["tools/", "bench/", ".github/"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "evtxkit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
crc32fast = "1.4"
flate2 = "1.1"
proptest = "1.6"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.bench]
lto = "thin"
codegen-units = 4

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
